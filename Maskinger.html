<title>Maskinger</title>
<style>
  @layer reset, base, component, utility;

  @layer reset {
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    textarea {
      border: 0;
      resize: vertical;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }
  }

  @layer base {
    :root {
      color-scheme: light;
      --ln-primary: oklch(0.66 0.16 151);
      --ln-primary-hover: color-mix(in oklch, var(--ln-primary) 84%, black);
      --ln-primary-soft: color-mix(in oklch, var(--ln-primary) 18%, white);
      --ln-primary-faint: color-mix(in oklch, var(--ln-primary) 7%, white);
      --ln-focus-ring: color-mix(in oklch, var(--ln-primary) 24%, transparent);
      --ln-bg: oklch(0.99 0.004 170);
      --ln-bg-soft: oklch(0.97 0.006 200);
      --ln-surface: oklch(1 0 0);
      --ln-header-bg: oklch(0.96 0.006 200);
      --ln-border: oklch(0.89 0.011 210);
      --ln-border-strong: oklch(0.78 0.018 210);
      --ln-text: oklch(0.25 0.018 210);
      --ln-text-muted: oklch(0.48 0.018 210);
      --ln-text-tertiary: oklch(0.54 0.016 210);
      --ln-text-on-primary: oklch(1 0 0);
      --ln-color-danger: oklch(0.58 0.18 29);
      --ln-color-danger-hover: oklch(0.52 0.18 29);
      --ln-color-danger-soft: oklch(0.95 0.04 29);
      --ln-color-warning: oklch(0.72 0.13 76);
      --ln-radius-sm: 4px;
      --ln-radius-md: 6px;
      --ln-radius-lg: 8px;
      --ln-radius-pill: 9999px;
      --ln-space-2: 4px;
      --ln-space-3: 6px;
      --ln-space-4: 8px;
      --ln-space-5: 12px;
      --ln-space-6: 16px;
      --ln-space-7: 20px;
      --ln-space-8: 24px;
      --ln-control-btn-min-block-size: 30px;
      --font-family-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      --font-family-mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      --page-max-width: 1360px;
      --bg-app: var(--ln-bg);
      --bg-main: var(--ln-bg);
      --bg-hover: var(--ln-primary-faint);
      --bg-hover-strong: var(--ln-primary-soft);
      --bg-code: var(--ln-header-bg);
      --bg-overlay: oklch(0 0 0 / 0.5);
      --border: var(--ln-border);
      --border-strong: var(--ln-border-strong);
      --text-primary: var(--ln-text);
      --text-secondary: var(--ln-text-muted);
      --text-tertiary: var(--ln-text-tertiary);
      --accent: var(--ln-primary);
      --accent-soft: var(--ln-primary-soft);
      --shadow-menu: 0 0 0 1px oklch(0 0 0 / 0.06), 0 8px 24px oklch(0 0 0 / 0.14);
      --shadow-modal: 0 20px 60px oklch(0 0 0 / 0.3);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ln-primary: oklch(0.72 0.14 151);
      --ln-primary-hover: color-mix(in oklch, var(--ln-primary) 86%, white);
      --ln-primary-soft: color-mix(in oklch, var(--ln-primary) 30%, black);
      --ln-primary-faint: color-mix(in oklch, var(--ln-primary) 17%, var(--ln-surface));
      --ln-focus-ring: color-mix(in oklch, var(--ln-primary) 28%, transparent);
      --ln-bg: oklch(0.18 0.008 210);
      --ln-bg-soft: oklch(0.22 0.01 210);
      --ln-surface: oklch(0.21 0.01 210);
      --ln-header-bg: oklch(0.26 0.012 210);
      --ln-border: oklch(0.35 0.014 210);
      --ln-border-strong: oklch(0.45 0.016 210);
      --ln-text: oklch(0.9 0.006 210);
      --ln-text-muted: oklch(0.68 0.01 210);
      --ln-text-tertiary: oklch(0.64 0.011 210);
      --ln-color-danger: oklch(0.68 0.18 29);
      --ln-color-danger-hover: oklch(0.74 0.17 29);
      --ln-color-danger-soft: oklch(0.29 0.06 29);
      --ln-color-warning: oklch(0.79 0.12 76);
      --bg-main: oklch(0.23 0.008 210);
      --bg-overlay: oklch(0 0 0 / 0.58);
      --shadow-menu: 0 0 0 1px oklch(0 0 0 / 0.24), 0 8px 24px oklch(0 0 0 / 0.36);
      --shadow-modal: 0 20px 60px oklch(0 0 0 / 0.42);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family-base);
      font-size: 15px;

<body class="cl-root">
<div class="app">
  <main class="main">
    <div class="editor-scroll">
      <div class="page-container">
        <div class="note-heading">

        <section class="steps-grid" aria-label="Mask and restore workspace">

            <header class="panel-header">
              <div class="panel-title"><span class="step-badge">1</span><span>マスク前</span></div>

            <div class="panel-body">
              <label class="text-shell" for="source-input">
                <span class="field-label">貼り付ける値</span>

              </label>
            </div>
          </article>

          <article class="work-panel">
            <header class="panel-header">
              <div class="panel-title"><span class="step-badge">2</span><span>マスク後</span></div>
              <div class="panel-actions">
                <button class="panel-action" id="copy-masked-btn" type="button">コピー</button>
              </div>
            </header>
            <div class="panel-body">
              <label class="text-shell" for="masked-output">
                <span class="field-label">マスク済みテキスト</span>
                <textarea class="editor-textarea" id="masked-output" spellcheck="false" readonly placeholder="マスク済みテキストがここに表示されます"></textarea>
              </label>

          <article class="work-panel">
            <header class="panel-header">

              <label class="text-shell compact" for="restore-input">
                <span class="field-label">復元前</span>

              </label>
              <label class="text-shell compact" for="restore-output">
                <span class="field-label">復元結果</span>
                <textarea class="editor-textarea" id="restore-output" spellcheck="false" readonly placeholder="対応表から復元した結果がここに表示されます"></textarea>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'maskinger.activeMappings.v2';
  const PLACEHOLDER_RE = /MASK_[A-Z0-9]+(?:_[A-Z0-9]+)*_\d{4,}/g;
  const PLACEHOLDER_VALUE_RE = /^MASK_[A-Z0-9]+(?:_[A-Z0-9]+)*_\d{4,}$/;
  const RESTORE_RE = /\[(MASK_[A-Z0-9]+(?:_[A-Z0-9]+)*_\d{4,}|[A-Z0-9]+(?:_[A-Z0-9]+)*_\d{4,})\]|MASK_[A-Z0-9]+(?:_[A-Z0-9]+)*_\d{4,}/g;
  const MASKINGER_INPUT_MAX_BYTES = 1024 * 1024;
  const MASKINGER_INPUT_MAX_LINES = 5000;
  const MASKINGER_MAX_MAPPINGS = 1000;
  const MASKINGER_MAPPING_RENDER_MAX_ROWS = 200;
  const MASKINGER_MAPPING_ORIGINAL_MAX_BYTES = 16 * 1024;
  const MASKINGER_STORAGE_MAX_BYTES = 2 * 1024 * 1024;

  const _state = {
    _counterByType: new Map(),
    _mappings: [],
    _placeholderByKey: new Map()
  };

  const $ = (selector, root = document) => root.querySelector(selector);

  const $sourceInput = $('#source-input');
  const $maskedOutput = $('#masked-output');
  const $restoreInput = $('#restore-input');
  const $restoreOutput = $('#restore-output');
  const $modeLabel = $('#mode-label');
  const $mappingCount = $('#mapping-count');
  const $restoredCount = $('#restored-count');
  const $unresolvedCount = $('#unresolved-count');
  const $mappingBody = $('#mapping-body');
  const $toast = $('#toast');

  let _hideOriginals = false;
  let _toastTimer = 0;
  let _lastAcceptedSourceValue = '';
  let _lastAcceptedRestoreValue = '';
  let _mappingSaveDepth = 0;
  let _pendingMappingSave = false;
  const _copyFeedbackTimers = new WeakMap();

  const SQL_KEYWORDS = new Set(`
    ABORT ACTION ADD AFTER ALL ALTER ANALYZE AND ANY ARRAY AS ASC AUTOINCREMENT BEFORE BEGIN BETWEEN
    BOTH BY CASCADE CASE CAST CHECK COLLATE COLUMN COMMIT CONFLICT CONSTRAINT CREATE CROSS CURRENT
    CURRENT_DATE CURRENT_TIME CURRENT_TIMESTAMP DATABASE DEFAULT DEFERRABLE DELETE DESC DISTINCT DO
    DROP ELSE END ESCAPE EXCEPT EXCLUDE EXISTS EXPLAIN FALSE FILTER FIRST FOLLOWING FOR FOREIGN FROM
    FULL GENERATED GLOB GRANT GROUP HAVING IF ILIKE IN INDEX INITIALLY INNER INSERT INTERSECT INTERVAL
    INTO IS ISNULL JOIN KEY LAST LATERAL LEFT LIKE LIMIT MATERIALIZED MERGE NATURAL NO NOT NOTNULL NULL
    NULLS OF OFFSET ON OR ORDER OUTER OVER PARTITION PLAN PRAGMA PRECEDING PRIMARY QUALIFY QUERY RAISE
    RANGE RECURSIVE REFERENCES REGEXP REINDEX RELEASE RENAME REPLACE RESTRICT RETURNING RIGHT ROLLBACK
    ROW ROWS SAMPLE SAVEPOINT SELECT SET TABLE TEMP TEMPORARY THEN TIES TO TRANSACTION TRIGGER TRUE
    UNBOUNDED UNION UNIQUE UNNEST UPDATE USING VACUUM VALUES VIEW VIRTUAL WHEN WHERE WINDOW WITH WITHOUT
  `.trim().split(/\s+/));

  const SQL_FUNCTIONS = new Set(`
    ABS AVG COALESCE CONCAT COUNT DATE DATE_TRUNC EXTRACT IFNULL JSON_VALUE LENGTH LOWER MAX MIN NOW
    NULLIF ROUND ROW_NUMBER SUBSTRING SUM TRIM UPPER
  `.trim().split(/\s+/));

  const SQL_TYPES = new Set(`
    BIGINT BOOL BOOLEAN CHAR DATE DATETIME DECIMAL DOUBLE FLOAT INT INTEGER JSON NUMERIC REAL SERIAL
    SMALLINT TEXT TIME TIMESTAMP UUID VARCHAR
  `.trim().split(/\s+/));

  const CODE_KEYWORDS = new Set(`
    abstract arguments as async await boolean break byte case catch char class const continue debugger
    default delete do double else enum export extends false final finally float for from function get
    if implements import in instanceof int interface let long module namespace new null of package
    private protected public return set short static string super switch symbol this throw true try
    type typeof undefined var void while with yield
  `.trim().split(/\s+/));

  const TYPE_CONTEXT_WORDS = new Set(['class', 'interface', 'type', 'enum', 'extends', 'implements', 'new']);

  const SECRET_VALUE_RE = /^(?:sk-ant-[A-Za-z0-9_-]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{24,}|(?:sk|pk)_(?:live|test)_[0-9A-Za-z]{16,}|xox[baprs]-[0-9A-Za-z-]{16,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})$/;

  function _escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function _normalizeNewlines(value) {
    return String(value ?? '').replace(/\r\n?/g, '\n');
  }

  function _utf8ByteLength(value) {
    return new TextEncoder().encode(String(value ?? '')).length;
  }

  function _formatBytes(bytes) {
    if (bytes >= 1024 * 1024) return `${Math.round((bytes / (1024 * 1024)) * 10) / 10} MiB`;
    if (bytes >= 1024) return `${Math.round((bytes / 1024) * 10) / 10} KiB`;
    return `${bytes} bytes`;
  }

  function _lineCount(value, stopAfter = Infinity) {
    const text = String(value ?? '');
    if (!text) return 0;
    let count = 1;
    for (let index = 0; index < text.length; index += 1) {
      if (text.charCodeAt(index) === 10) {
        count += 1;
        if (count > stopAfter) return count;
      }
    }
    return count;
  }

  function _limitViolation(code, message, detail = {}) {
    return { code, message, ...detail };
  }

  function _limitError(violation) {
    const error = new Error(violation.message);
    error._maskingerLimitViolation = violation;
    return error;
  }

  function _isLimitError(error) {
    return Boolean(error && error._maskingerLimitViolation);
  }

  function _inputLimitViolation(input, label = '入力') {
    const text = _normalizeNewlines(input);
    const bytes = _utf8ByteLength(text);
    if (bytes > MASKINGER_INPUT_MAX_BYTES) {
      return _limitViolation(
        'input_bytes',
        `${label}は${_formatBytes(MASKINGER_INPUT_MAX_BYTES)}までです。大きなログは範囲を分けて貼り付けてください。`,
        { bytes, maxBytes: MASKINGER_INPUT_MAX_BYTES }
      );
    }
    const lines = _lineCount(text, MASKINGER_INPUT_MAX_LINES + 1);
    if (lines > MASKINGER_INPUT_MAX_LINES) {
      return _limitViolation(
        'input_lines',
        `${label}は${MASKINGER_INPUT_MAX_LINES}行までです。大きなログは範囲を分けて貼り付けてください。`,
        { lines, maxLines: MASKINGER_INPUT_MAX_LINES }
      );
    }
    return null;
  }

  function _storageAvailable() {
    try {
      const key = `${STORAGE_KEY}.probe`;
      sessionStorage.setItem(key, '1');
      sessionStorage.removeItem(key);
      return true;
    } catch (_) {
      return false;
    }
  }

  function _parsePlaceholder(placeholder) {
    const match = /^MASK_(.+)_(\d{4,})$/.exec(placeholder);
    if (!match) return null;
    return { type: match[1], number: Number(match[2]) };
  }

  function _mappingKey(type, original) {
    return `${type}\u0000${original}`;
  }

  function _isPlaceholderValue(value) {
    return PLACEHOLDER_VALUE_RE.test(String(value ?? '').trim());
  }

  function _normalizeMappingType(value) {
    const type = String(value ?? '').trim().toUpperCase();
    return /^[A-Z0-9]+(?:_[A-Z0-9]+)*$/.test(type) ? type : '';
  }

  function _placeholderForNumber(type, number) {
    return `MASK_${type}_${String(number).padStart(4, '0')}`;
  }

  function _nextPlaceholderNumber(type, stateRef = _state) {
    return (stateRef._counterByType.get(type) || 0) + 1;
  }

  function _serializedMappingsByteLength(items = _state._mappings) {
    return _utf8ByteLength(JSON.stringify(Array.isArray(items) ? items : []));
  }

  function _mappingStorageLimitViolation(items) {
    const bytes = _serializedMappingsByteLength(items);
    if (bytes <= MASKINGER_STORAGE_MAX_BYTES) return null;
    return _limitViolation(
      'mapping_storage_bytes',
      `対応表の保存容量は${_formatBytes(MASKINGER_STORAGE_MAX_BYTES)}までです。対応表を破棄するか、入力範囲を分けてください。`,
      { bytes, maxBytes: MASKINGER_STORAGE_MAX_BYTES }
    );
  }

  function _resetMappingState() {
    _state._counterByType = new Map();
    _state._mappings = [];
    _state._placeholderByKey = new Map();
  }

  function _snapshotMappingState() {
    return {
      _counterByType: new Map(_state._counterByType),
      _mappings: _state._mappings.map((item) => ({ ...item })),
      _placeholderByKey: new Map(_state._placeholderByKey)
    };
  }

  function _restoreMappingState(snapshot) {
    _state._counterByType = new Map(snapshot._counterByType);
    _state._mappings = snapshot._mappings.map((item) => ({ ...item }));
    _state._placeholderByKey = new Map(snapshot._placeholderByKey);
  }

  function _estimateMappingAllowance(type, original, stateRef = _state, placeholder = null) {
    const normalizedType = _normalizeMappingType(type);
    const normalizedOriginal = String(original ?? '');
    if (!normalizedType) {
      return {
        ok: false,
        violation: _limitViolation('mapping_type', '対応表の種類が不正なため処理を中断しました。')
      };
    }
    if (_isPlaceholderValue(normalizedOriginal)) {
      return { ok: true, passthrough: normalizedOriginal, type: normalizedType, original: normalizedOriginal };
    }
    const key = _mappingKey(normalizedType, normalizedOriginal);
    const existing = stateRef._placeholderByKey.get(key);
    if (existing) return { ok: true, existing, type: normalizedType, original: normalizedOriginal };
    const originalBytes = _utf8ByteLength(normalizedOriginal);
    if (originalBytes > MASKINGER_MAPPING_ORIGINAL_MAX_BYTES) {
      return {
        ok: false,
        violation: _limitViolation(
          'mapping_original_bytes',
          `対応表の元値は1件あたり${_formatBytes(MASKINGER_MAPPING_ORIGINAL_MAX_BYTES)}までです。大きな値は範囲を分けてください。`,
          { bytes: originalBytes, maxBytes: MASKINGER_MAPPING_ORIGINAL_MAX_BYTES }
        )
      };
    }
    if (stateRef._mappings.length >= MASKINGER_MAX_MAPPINGS) {
      return {
        ok: false,
        violation: _limitViolation(
          'mapping_count',
          `対応表は${MASKINGER_MAX_MAPPINGS}件までです。対応表を破棄するか、入力範囲を分けてください。`,
          { count: stateRef._mappings.length, maxMappings: MASKINGER_MAX_MAPPINGS }
        )
      };
    }
    const nextNumber = _nextPlaceholderNumber(normalizedType, stateRef);
    const nextPlaceholder = placeholder || _placeholderForNumber(normalizedType, nextNumber);
    const storageViolation = _mappingStorageLimitViolation([
      ...stateRef._mappings,
      {
        _placeholder: nextPlaceholder,
        _type: normalizedType,
        _original: normalizedOriginal
      }
    ]);
    if (storageViolation) {
      return { ok: false, violation: storageViolation };
    }
    return {
      ok: true,
      type: normalizedType,
      original: normalizedOriginal,
      placeholder: nextPlaceholder,
      number: nextNumber
    };
  }

  function _replaceMappingsFromItems(items) {
    _resetMappingState();
    if (!Array.isArray(items)) return { loaded: 0, skipped: 0, trimmed: 0 };
    const loadedPlaceholders = new Set();
    let skipped = 0;
    let trimmed = 0;
    for (let index = 0; index < items.length; index += 1) {
      if (_state._mappings.length >= MASKINGER_MAX_MAPPINGS) {
        trimmed = items.length - index;
        break;
      }
      const item = items[index];
      if (!item || typeof item._placeholder !== 'string' || typeof item._type !== 'string') {
        skipped += 1;
        continue;
      }
      const parsedPlaceholder = _parsePlaceholder(item._placeholder);
      const type = _normalizeMappingType(item._type);
      if (!parsedPlaceholder || !type || parsedPlaceholder.type !== type || loadedPlaceholders.has(item._placeholder)) {
        skipped += 1;
        continue;
      }
      if (!Number.isSafeInteger(parsedPlaceholder.number) || parsedPlaceholder.number < 1) {
        skipped += 1;
        continue;
      }
      const original = String(item._original ?? '');
      const allowance = _estimateMappingAllowance(type, original, _state, item._placeholder);
      if (!allowance.ok || allowance.passthrough || allowance.existing) {
        if (allowance.violation?.code === 'mapping_storage_bytes') {
          trimmed = items.length - index;
          break;
        }
        skipped += 1;
        continue;
      }
      const mapping = {
        _placeholder: item._placeholder,
        _type: allowance.type,
        _original: allowance.original
      };
      _state._mappings.push(mapping);
      loadedPlaceholders.add(mapping._placeholder);
      _state._placeholderByKey.set(_mappingKey(mapping._type, mapping._original), mapping._placeholder);
      const current = _state._counterByType.get(parsedPlaceholder.type) || 0;
      _state._counterByType.set(parsedPlaceholder.type, Math.max(current, parsedPlaceholder.number));
    }
    return { loaded: _state._mappings.length, skipped, trimmed };
  }

  function _loadMappings() {
    if (!_storageAvailable()) return;
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      if (_utf8ByteLength(raw) > MASKINGER_STORAGE_MAX_BYTES) {
        sessionStorage.removeItem(STORAGE_KEY);
        _showToast('保存済み対応表が大きすぎるため読み込みませんでした。');
        return;
      }
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return;
      const result = _replaceMappingsFromItems(parsed);
      if (result.skipped || result.trimmed) {
        _saveMappings();
        _showToast('保存済み対応表の一部を安全な上限に合わせて読み込みました。');
      }
    } catch (_) {
      _resetMappingState();
      try {
        sessionStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
    }
  }

  function _saveMappings() {
    if (!_storageAvailable()) return;
    const serialized = JSON.stringify(_state._mappings);
    const storageViolation = _mappingStorageLimitViolation(_state._mappings);
    if (storageViolation) {
      _showToast(storageViolation.message);
      return;
    }
    try {
      sessionStorage.setItem(STORAGE_KEY, serialized);
    } catch (_) {
      _showToast('対応表の保存に失敗しました。タブ内のメモリ上では処理を継続します。');
    }
  }

  function _markMappingsDirty() {
    if (_mappingSaveDepth > 0) {
      _pendingMappingSave = true;
      return;
    }
    _saveMappings();
  }

  function _nextPlaceholder(type, number = _nextPlaceholderNumber(type)) {
    const next = number;
    _state._counterByType.set(type, next);
    return _placeholderForNumber(type, next);
  }

  function _remember(type, original) {
    const allowance = _estimateMappingAllowance(type, original);
    if (allowance.passthrough) return allowance.passthrough;
    if (allowance.existing) return allowance.existing;
    if (!allowance.ok) throw _limitError(allowance.violation);

    const placeholder = _nextPlaceholder(allowance.type, allowance.number);
    _state._placeholderByKey.set(_mappingKey(allowance.type, allowance.original), placeholder);
    _state._mappings.push({
      _placeholder: placeholder,
      _type: allowance.type,
      _original: allowance.original
    });
    _markMappingsDirty();
    return placeholder;
  }

  function _maskWith(type, original) {
    if (original == null || original === '') return original;
    return _remember(type, original);
  }

  function _looksLikeSql(text) {
    const sample = String(text).slice(0, 12000);
    const hasMainVerb = /\b(SELECT|INSERT|UPDATE|DELETE|MERGE|WITH)\b/i.test(sample);
    const hasClause = /\b(FROM|JOIN|WHERE|GROUP\s+BY|ORDER\s+BY|VALUES|SET)\b/i.test(sample);
    const hasSqlShape = /(?:\bSELECT\b[\s\S]{0,800}\bFROM\b|\bUPDATE\b[\s\S]{0,400}\bSET\b|\bINSERT\s+INTO\b|\bDELETE\s+FROM\b)/i.test(sample);
    const hasDynamicSqlTag = /<\/?(?:include|sql|select|insert|update|delete|where|set|trim|if|choose|when|otherwise|foreach|is[A-Z][A-Za-z0-9_-]*)\b/i.test(sample);
    const hasDynamicSqlFragment = hasDynamicSqlTag
      && (/\b(?:AND|OR|WHERE|SET|FROM|JOIN|ORDER\s+BY|GROUP\s+BY|VALUES)\b/i.test(sample) || /[#:$]\{[^}]+\}|#[A-Za-z_][\w$.\[\]]*#|:\w+|@\w+/.test(sample));
    return hasSqlShape || (hasMainVerb && hasClause) || hasDynamicSqlFragment;

  function _looksLikeCode(text) {
    const sample = String(text).slice(0, 12000);
    let score = 0;
    if (/[{};]/.test(sample)) score += 1;
    if (/\b(class|function|const|let|var|return|import|export|async|await|def|public|private)\b/.test(sample)) score += 2;
    if (/=>|::|===|!==|\.[A-Za-z_$][\w$]*\s*\(/.test(sample)) score += 1;
    if (/^\s*(\/\/|#|\/\*)/m.test(sample)) score += 1;

  function _hasStrongCodeSignals(text) {
    const sample = _stripSqlXmlNoiseForMode(text).slice(0, 12000);
    return /[{}]/.test(sample)
      || /\b(class|function|const|let|var|return|import|export|async|await|def|interface|extends|implements)\b/.test(sample)
      || /=>|===|!==|::/.test(sample);
  }

  function _stripSqlXmlNoiseForMode(text) {
    return String(text)
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/<\/?[A-Za-z][A-Za-z0-9:_-]*(?:\s+[^<>]*?)?\s*\/?>/g, ' ')
      .replace(/[#$]\{[^}]*\}/g, ' ')
      .replace(/#[A-Za-z_][\w$.\[\]]*#/g, ' ');

  function _detectMode(text) {
    const value = String(text);
    if (!value.trim()) return 'EMPTY';
    const sql = _looksLikeSql(value);
    const code = _looksLikeCode(value);
    if (sql && (!code || !_hasStrongCodeSignals(value))) return 'SQL';
    if (code) return 'CODE';
    if (sql) return 'SQL';
    return 'TEXT';
  }

  function _modeText(mode) {
    return {
      EMPTY: '空',
      TEXT: '通常テキスト',
      CODE: 'コード',
      SQL: 'SQL'
    }[mode] || '通常テキスト';
  }

  function _maskText(input) {
    const text = _normalizeNewlines(input);
    const inputViolation = _inputLimitViolation(text, 'マスク前の入力');
    if (inputViolation) return { text: '', mode: 'LIMIT', rejected: true, violation: inputViolation };

    const snapshot = _snapshotMappingState();
    const previousSaveDepth = _mappingSaveDepth;
    const previousPendingSave = _pendingMappingSave;
    _mappingSaveDepth += 1;
    _pendingMappingSave = false;
    try {
      const mode = _detectMode(text);
      let result;
      if (mode === 'EMPTY') {
        result = { text: '', mode };
      } else if (mode === 'SQL') {
        result = { text: _maskSql(text), mode };
      } else {
        const protectedXml = _protectSqlXmlTags(text);
        const masked = mode === 'CODE' ? _maskCode(protectedXml.text) : _maskGeneric(protectedXml.text);
        result = { text: _restoreProtectedSegments(masked, protectedXml.segments), mode };
      }
      const shouldSaveMappings = _pendingMappingSave;
      _mappingSaveDepth = previousSaveDepth;
      _pendingMappingSave = previousPendingSave;
      if (shouldSaveMappings) {
        if (_mappingSaveDepth > 0) _pendingMappingSave = true;
        else _saveMappings();
      }
      return result;
    } catch (error) {
      _restoreMappingState(snapshot);
      _mappingSaveDepth = previousSaveDepth;
      _pendingMappingSave = previousPendingSave;
      if (_isLimitError(error)) {
        return {
          text: '',
          mode: 'LIMIT',
          rejected: true,
          violation: error._maskingerLimitViolation

      throw error;
    }
  }

  function _maskGeneric(text) {
    let out = String(text);

    out = out.replace(/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g, (match) => _maskWith('SECRET', match));
    out = out.replace(/\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|amqps?|jdbc:[a-z0-9]+):\/\/[^\s'"`<>]+/gi, (match) => _maskWith('SECRET', match));
    out = out.replace(/\b(Authorization\s*:\s*(?:Bearer|Basic)\s+)([A-Za-z0-9._~+/=-]{12,})/gi, (match, prefix, token) => {

    out = out.replace(/\b(Bearer|Basic)\s+([A-Za-z0-9._~+/=-]{12,})/gi, (match, scheme, token) => {

      /\bsk-proj-[A-Za-z0-9_-]{16,}\b/g,
      /\bsk-[A-Za-z0-9_-]{20,}\b/g,
      /\bgh[pousr]_[A-Za-z0-9_]{20,}\b/g,
      /\bgithub_pat_[A-Za-z0-9_]{20,}\b/g,
      /\bAIza[0-9A-Za-z_-]{24,}\b/g,
      /\b(?:sk|pk)_(?:live|test)_[0-9A-Za-z]{16,}\b/g,
      /\bxox[baprs]-[0-9A-Za-z-]{16,}\b/g,
      /\bAKIA[0-9A-Z]{16}\b/g,
      /\bASIA[0-9A-Z]{16}\b/g

    out = out.replace(/\bhttps?:\/\/[^\s'"`<>]+/gi, (match) => _maskWith('URL', match));

    out = out.replace(/(["']?(?:password|passwd|pwd|token|api[_-]?key|secret|client[_-]?secret|access[_-]?key|email|phone|address|user[_-]?id)["']?\s*[:=]\s*)(["']?)([^"',;\n]+)(\2)/gi, (match, prefix, quote, value, closeQuote) => {

      const type = /email/i.test(prefix) ? 'EMAIL' : /phone/i.test(prefix) ? 'PHONE' : /address/i.test(prefix) ? 'ADDRESS' : /user[_-]?id/i.test(prefix) ? 'PII_ID' : 'SECRET';

      const trailing = value.match(/\s*$/)[0];

    });

    out = out.replace(/\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b/g, (match) => _maskWith('ACCOUNT', match));
    out = out.replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi, (match) => _maskWith('UUID', match));
    out = out.replace(/\b\d{3}-\d{2}-\d{4}\b/g, (match) => _maskWith('PII_ID', match));
    out = out.replace(/\b(?:\d[ -]*?){13,19}\b/g, (match) => {
      const digits = match.replace(/\D/g, '');

      return _maskWith('CARD', match);
    });
    out = out.replace(/\b\d{4}\s?\d{4}\s?\d{4}\b/g, (match) => _maskWith('PII_ID', match));

    out = out.replace(/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi, (match) => _maskWith('EMAIL', match));
    out = out.replace(/(^|[^@\w])((?:[a-z0-9-]+\.)+(?:com|net|org|io|jp|co\.jp|dev|app|cloud|local|internal)\b)/gi, (match, prefix, domain) => `${prefix}${_maskWith('DOMAIN', domain)}`);
    out = out.replace(/\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b/g, (match) => _maskWith('IP', match));
    out = out.replace(/\b[0-9a-f]{2}(?::[0-9a-f]{2}){5}\b/gi, (match) => _maskWith('MAC', match));
    out = out.replace(/\b(?:[0-9a-f]{1,4}:){2,7}[0-9a-f]{1,4}\b/gi, (match) => _maskWith('IP', match));
    out = out.replace(/\b(?:\+?\d{1,3}[-.\s]?)?(?:\(?0\d{1,4}\)?[-.\s]?)\d{2,4}[-.\s]?\d{3,4}\b/g, (match) => _maskWith('PHONE', match));
    out = out.replace(/〒?\d{3}-?\d{4}/g, (match) => _maskWith('POSTAL', match));
    out = out.replace(/(?:[A-Za-z]:\\(?:[^\\/:*?"<>|\r\n]+\\?)+|\/(?:Users|home|var|etc|opt|srv|tmp)\/[^\s'"`<>]+)/g, (match) => _maskWith('PATH', match));
    out = out.replace(/((?:氏名|名前|担当者|顧客名)\s*[:：=]\s*)([^\n,;]{2,60})/g, (_, prefix, value) => prefix + _maskWith('PERSON', value.trim()));
    out = out.replace(/((?:会社名|組織名|法人名|部署名)\s*[:：=]\s*)([^\n,;]{2,80})/g, (_, prefix, value) => prefix + _maskWith('ORG', value.trim()));
    out = out.replace(/((?:住所|所在地)\s*[:：=]\s*)([^\n,;]{2,120})/g, (_, prefix, value) => prefix + _maskWith('ADDRESS', value.trim()));

  }

  function _passesLuhn(digits) {

      doubleIt = !doubleIt;

  function _maskCode(text) {

  function _maskCodeCommentsAndStrings(text) {

    let i = 0;
    const segments = [];
    const pushSegment = (value) => {
      const token = `\uE000${String.fromCharCode(0xE100 + segments.length)}\uE001`;
      segments.push({ token, value });

    while (i < text.length) {

      const next = text[i + 1];

      if (ch === '/' && next === '/') {

        const content = text.slice(i + 2, end);
        out += pushSegment(`//${_maskWith('COMMENT', content)}`);
        i = end;
        continue;
      }

      if (ch === '/' && next === '*') {
        const end = text.indexOf('*/', i + 2);
        const close = end === -1 ? text.length : end;
        const content = text.slice(i + 2, close);
        out += pushSegment(`/*${_maskWith('COMMENT', content)}${end === -1 ? '' : '*/'}`);
        i = end === -1 ? text.length : end + 2;
        continue;
      }

      if (ch === '#' && _isLineCommentPosition(text, i)) {
        const end = _indexOfLineEnd(text, i + 1);
        const content = text.slice(i + 1, end);
        out += pushSegment(`#${_maskWith('COMMENT', content)}`);
        i = end;
        continue;
      }

      if (ch === '-' && next === '-' && _isLineCommentPosition(text, i)) {
        const end = _indexOfLineEnd(text, i + 2);
        const content = text.slice(i + 2, end);
        out += pushSegment(`--${_maskWith('COMMENT', content)}`);
        i = end;
        continue;

      if (ch === '"' || ch === "'" || ch === '`') {

        const inner = parsed.inner;
        let maskedLiteral = '';
        if (_looksLikeSql(inner)) {

        } else if (SECRET_VALUE_RE.test(inner.trim())) {

        } else {

      i += 1;

  function _restoreCodeSegments(text, segments) {
    let out = text;

  function _indexOfLineEnd(text, start) {

  function _isLineCommentPosition(text, index) {

    const before = text.slice(0, index);
    const lineStart = before.lastIndexOf('\n') + 1;

  function _readQuoted(text, start, quote) {
    let i = start + 1;
    let inner = '';
    let escaped = false;
    while (i < text.length) {
      const ch = text[i];
      if (escaped) {
        inner += ch;
        escaped = false;
        i += 1;
        continue;
      }
      if (ch === '\\') {
        inner += ch;
        escaped = true;
        i += 1;
        continue;
      }
      if (ch === quote) {

      inner += ch;
      i += 1;

  function _maskCodeNumbers(text) {

      if (CODE_KEYWORDS.has(word)) return word;

      if (CODE_KEYWORDS.has(lower)) return word;
      const previousWord = _wordBefore(source, offset).toLowerCase();
      const previousChar = _previousNonSpace(source, offset);
      const nextChar = _nextNonSpace(source, offset + word.length);

      let type = 'CODE_VAR';
      if (TYPE_CONTEXT_WORDS.has(previousWord) || /^[A-Z]/.test(word)) {

    });

  function _wordBefore(source, offset) {
    const before = source.slice(0, offset).match(/[$A-Za-z_][\w$]*\s*$/);
    return before ? before[0].trim() : '';
  }

  function _previousNonSpace(source, offset) {
    for (let i = offset - 1; i >= 0; i -= 1) {
      if (!/\s/.test(source[i])) return source[i];
    }
    return '';
  }

  function _nextNonSpace(source, offset) {
    for (let i = offset; i < source.length; i += 1) {

    }
    return '';
  }

  function _maskSql(sql) {

    const tokens = _tokenizeSql(protectedSql.text);
    let clause = 'NEUTRAL';
    let expectTable = false;
    let tablePathActive = false;
    let pendingTableAlias = false;
    let preserveNextAlias = false;
    let parenDepth = 0;
    let insertColumnDepth = 0;

    const columnClauses = new Set(['SELECT', 'WHERE', 'ON', 'GROUP', 'ORDER', 'HAVING', 'SET', 'RETURNING', 'USING', 'INSERT_COLUMNS']);

    const rememberClause = (upper) => {
      if (upper === 'AS') return;
      if (upper === 'SELECT') { clause = 'SELECT'; pendingTableAlias = false; }
      if (upper === 'FROM') { clause = 'FROM'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'JOIN') { clause = 'JOIN'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'WHERE') { clause = 'WHERE'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'ON') { clause = 'ON'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'GROUP') { clause = 'GROUP'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'ORDER') { clause = 'ORDER'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'HAVING') { clause = 'HAVING'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'UPDATE') { clause = 'UPDATE'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'INTO') { clause = 'INTO'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'WITH') { clause = 'WITH'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'SET') { clause = 'SET'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'VALUES') { clause = 'VALUES'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'RETURNING') { clause = 'RETURNING'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'USING') { clause = 'USING'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
      if (upper === 'MERGE') { clause = 'MERGE'; expectTable = true; tablePathActive = false; pendingTableAlias = false; }
      if ((upper === 'AND' || upper === 'OR') && clause === 'NEUTRAL') { clause = 'WHERE'; expectTable = false; tablePathActive = false; pendingTableAlias = false; }
    };

    const shouldMaskTable = (prevValue, nextValue) => {
      if (prevValue === '.' && tablePathActive) return true;
      if (clause === 'WITH' && nextValue === 'AS') return true;
      return expectTable || tablePathActive;
    };

    const completeTableIfNeeded = (nextValue) => {
      if (nextValue === '.') {
        tablePathActive = true;
        return;
      }
      if (clause === 'INTO' && nextValue === '(') {
        clause = 'INSERT_COLUMNS';
        insertColumnDepth = parenDepth + 1;
      }
      expectTable = false;
      tablePathActive = false;
      pendingTableAlias = clause !== 'WITH' && nextValue !== '(';
    };

    const masked = tokens.map((token, index) => {
      if (token.kind === 'protected') {
        const original = protectedSql.byToken.get(token.value) || '';
        if (/^<where\b/i.test(original)) {
          clause = 'WHERE';
          expectTable = false;
          tablePathActive = false;
          pendingTableAlias = false;
        }
        if (/^<set\b/i.test(original)) {
          clause = 'SET';
          expectTable = false;
          tablePathActive = false;
          pendingTableAlias = false;
        }
        return token.value;
      }

      if (token.kind === 'space' || token.kind === 'operator') return token.value;

      if (token.kind === 'comment-line') {
        return `--${token.value}`;
      }

      if (token.kind === 'comment-block') {
        return `/*${token.value}*/`;
      }

      if (token.kind === 'string') {
        return `'${_maskWith('SQL_VALUE', token.value)}'`;
      }

      if (token.kind === 'param') {
        const placeholder = _maskWith('SQL_PARAM', token.inner ?? token.value.slice(1));
        return `${token.prefix ?? token.value[0]}${placeholder}${token.suffix ?? ''}`;
      }

      if (token.kind === 'number') {
        return _maskWith('SQL_VALUE', token.value);
      }

      if (token.kind === 'punct') {
        if (token.value === ',') {
          pendingTableAlias = false;
          preserveNextAlias = false;
          if (clause === 'FROM' || clause === 'JOIN') {
            expectTable = true;
            tablePathActive = false;
          }
        }
        if (token.value === '(') {
          parenDepth += 1;
          if (preserveNextAlias) preserveNextAlias = false;
        }
        if (token.value === ')') {
          if (clause === 'INSERT_COLUMNS' && parenDepth === insertColumnDepth) {
            clause = 'NEUTRAL';
            insertColumnDepth = 0;
          }
          parenDepth = Math.max(0, parenDepth - 1);
          pendingTableAlias = true;
          preserveNextAlias = false;
        }
        if (token.value === ';') {
          clause = 'NEUTRAL';
          expectTable = false;
          tablePathActive = false;
          pendingTableAlias = false;
          preserveNextAlias = false;
          insertColumnDepth = 0;
        }
        return token.value;
      }

      if (token.kind !== 'ident' && token.kind !== 'quoted-ident') return token.value;

      const value = token.value;
      const upper = value.toUpperCase();
      const prev = _previousSignificant(tokens, index);
      const next = _nextSignificant(tokens, index);
      const prevValue = prev ? prev.value.toUpperCase() : '';
      const nextValue = next ? next.value.toUpperCase() : '';
      const quote = token.kind === 'quoted-ident' ? token.quote : '';
      const formatIdentifier = (masked) => quote ? `${quote}${masked}${quote}` : masked;

      if (value.startsWith('MASK_')) return token.value;

      if (token.kind === 'ident' && (SQL_KEYWORDS.has(upper) || SQL_FUNCTIONS.has(upper) || SQL_TYPES.has(upper))) {
        if (upper === 'AS') {
          preserveNextAlias = Boolean(next && (next.kind === 'ident' || next.kind === 'quoted-ident'));
          pendingTableAlias = false;
        } else {
          preserveNextAlias = false;
          rememberClause(upper);
        }
        return token.value;
      }

      if (preserveNextAlias) {
        preserveNextAlias = false;
        return token.value;
      }

      if (pendingTableAlias && prevValue !== '.' && nextValue !== '.') {
        pendingTableAlias = false;
        return token.value;
      }

      if (nextValue === '(' && !shouldMaskTable(prevValue, nextValue)) {
        return token.value;
      }

      if (shouldMaskTable(prevValue, nextValue)) {
        completeTableIfNeeded(nextValue);
        return formatIdentifier(_maskWith('SQL_TABLE', value));
      }

      if (nextValue === '.') {
        return token.value;
      }

      if (prevValue === '.' || columnClauses.has(clause)) {
        return formatIdentifier(_maskWith('SQL_COL', value));
      }

      return token.value;
    }).join('');

    return _restoreProtectedSegments(masked, protectedSql.segments);
  }

  function _protectSqlXmlTags(sql) {
    const segments = [];
    const byToken = new Map();
    const pushSegment = (value) => {
      const token = `\uE000${String.fromCharCode(0xE300 + segments.length)}\uE001`;
      segments.push({ token, value });
      byToken.set(token, value);
      return token;
    };

    const text = String(sql)
      .replace(/<!--[\s\S]*?-->/g, (match) => pushSegment(match))
      .replace(/<\/?[A-Za-z][A-Za-z0-9:_-]*(?:\s+[^<>]*?)?\s*\/?>/g, (match) => pushSegment(match));

    return { text, segments, byToken };
  }

  function _restoreProtectedSegments(text, segments) {
    let out = text;
    for (const segment of segments) {
      out = out.split(segment.token).join(segment.value);
    }
    return out;
  }

  function _tokenizeSql(sql) {
    const tokens = [];
    let i = 0;
    while (i < sql.length) {
      const ch = sql[i];
      const next = sql[i + 1];

      if (ch === '\uE000') {
        const end = sql.indexOf('\uE001', i + 1);
        if (end !== -1) {
          tokens.push({ kind: 'protected', value: sql.slice(i, end + 1) });
          i = end + 1;
          continue;
        }
      }

      if (/\s/.test(ch)) {
        const start = i;
        while (i < sql.length && /\s/.test(sql[i])) i += 1;
        tokens.push({ kind: 'space', value: sql.slice(start, i) });
        continue;
      }

      if (ch === '-' && next === '-') {
        const end = _indexOfLineEnd(sql, i + 2);
        tokens.push({ kind: 'comment-line', value: sql.slice(i + 2, end) });
        i = end;
        continue;
      }

      if (ch === '/' && next === '*') {
        const end = sql.indexOf('*/', i + 2);
        const close = end === -1 ? sql.length : end;
        tokens.push({ kind: 'comment-block', value: sql.slice(i + 2, close) });
        i = end === -1 ? sql.length : end + 2;
        continue;
      }

      if (ch === "'") {
        const parsed = _readSqlString(sql, i);
        tokens.push({ kind: 'string', value: parsed.inner });
        i = parsed.end;
        continue;
      }

      if (ch === '"' || ch === '`') {
        const parsed = _readQuoted(sql, i, ch);
        tokens.push({ kind: 'quoted-ident', value: parsed.inner, quote: ch });
        i = parsed.end;
        continue;
      }

      if ((ch === '#' || ch === '$') && next === '{') {
        const close = sql.indexOf('}', i + 2);
        if (close !== -1) {
          const inner = sql.slice(i + 2, close);
          tokens.push({ kind: 'param', value: sql.slice(i, close + 1), prefix: sql.slice(i, i + 2), inner, suffix: '}' });
          i = close + 1;
          continue;
        }
      }

      if (ch === '#' && _isIdentStart(next || '')) {
        const start = i;
        i += 2;
        while (i < sql.length && _isIdentPart(sql[i])) i += 1;
        if (sql[i] === '#') {
          const inner = sql.slice(start + 1, i);
          tokens.push({ kind: 'param', value: sql.slice(start, i + 1), prefix: '#', inner, suffix: '#' });
          i += 1;
          continue;
        }
        i = start;
      }

      if ((ch === ':' || ch === '@') && _isIdentStart(next || '')) {
        const start = i;
        i += 2;
        while (i < sql.length && _isIdentPart(sql[i])) i += 1;
        tokens.push({ kind: 'param', value: sql.slice(start, i), prefix: sql[start], inner: sql.slice(start + 1, i), suffix: '' });
        continue;
      }

      if (/\d/.test(ch)) {
        const start = i;
        i += 1;
        while (i < sql.length && /[0-9._]/.test(sql[i])) i += 1;
        tokens.push({ kind: 'number', value: sql.slice(start, i) });
        continue;
      }

      if (_isIdentStart(ch)) {
        const start = i;
        i += 1;
        while (i < sql.length && _isIdentPart(sql[i])) i += 1;
        tokens.push({ kind: 'ident', value: sql.slice(start, i) });
        continue;
      }

      if ('(),.;'.includes(ch)) {
        tokens.push({ kind: 'punct', value: ch });
        i += 1;
        continue;
      }

      tokens.push({ kind: 'operator', value: ch });
      i += 1;
    }
    return tokens;
  }

  function _readSqlString(text, start) {
    let i = start + 1;
    let inner = '';
    while (i < text.length) {
      const ch = text[i];
      if (ch === "'" && text[i + 1] === "'") {
        inner += "''";
        i += 2;
        continue;
      }
      if (ch === "'") return { inner, end: i + 1 };
      inner += ch;
      i += 1;
    }
    return { inner, end: i };
  }

  function _isIdentStart(ch) {
    return Boolean(ch) && /[A-Za-z_\p{L}]/u.test(ch);
  }

  function _isIdentPart(ch) {
    return Boolean(ch) && /[A-Za-z0-9_$\p{L}\p{N}]/u.test(ch);
  }

  function _previousSignificant(tokens, index) {
    for (let i = index - 1; i >= 0; i -= 1) {
      if (tokens[i].kind !== 'space') return tokens[i];
    }
    return null;
  }

  function _nextSignificant(tokens, index) {
    for (let i = index + 1; i < tokens.length; i += 1) {
      if (tokens[i].kind !== 'space') return tokens[i];
    }
    return null;
  }

  function _restoreKey(match, bracketed) {
    let key = bracketed || match;
    if (key.startsWith('[') && key.endsWith(']')) key = key.slice(1, -1);
    if (!key.startsWith('MASK_')) key = `MASK_${key}`;
    return key;
  }

  function _restoreText(input) {
    const inputViolation = _inputLimitViolation(input, '復元前の入力');
    if (inputViolation) {
      return { text: '', restored: 0, unresolved: 0, rejected: true, violation: inputViolation };
    }
    const byPlaceholder = new Map(_state._mappings.map((item) => [item._placeholder, item._original]));
    let restored = 0;
    let text = _normalizeNewlines(input);
    for (let pass = 0; pass < 8; pass += 1) {
      let changed = false;
      text = text.replace(RESTORE_RE, (match, bracketed) => {
        const key = _restoreKey(match, bracketed);
        if (!byPlaceholder.has(key)) return match;
        const original = byPlaceholder.get(key);
        if (original === match) return match;
        restored += 1;
        changed = true;
        return original;
      });
      if (!changed) break;
    }
    let unresolved = 0;
    text.replace(RESTORE_RE, (match, bracketed) => {
      const key = _restoreKey(match, bracketed);
      if (!byPlaceholder.has(key)) {
        unresolved += 1;
      }
      return match;
    });
    return { text, restored, unresolved };
  }

  function _renderMappings() {
    if ($mappingCount) $mappingCount.textContent = String(_state._mappings.length);
    if (!_state._mappings.length) {
      $mappingBody.innerHTML = '<tr><td class="empty-row" colspan="3">まだ対応表はありません。</td></tr>';
      return;
    }
    const visibleMappings = _state._mappings.slice(0, MASKINGER_MAPPING_RENDER_MAX_ROWS);
    const rows = visibleMappings.map((item) => `
      <tr>
        <td><code>${_escapeHTML(item._placeholder)}</code></td>
        <td><span class="type-pill">${_escapeHTML(item._type)}</span></td>
        <td class="original-cell${_hideOriginals ? ' is-hidden' : ''}">${_escapeHTML(item._original)}</td>
      </tr>
    `);
    if (_state._mappings.length > visibleMappings.length) {
      rows.push(`<tr><td class="empty-row" colspan="3">ほか${_state._mappings.length - visibleMappings.length}件は表示を省略しています。復元には使用されます。</td></tr>`);
    }
    $mappingBody.innerHTML = rows.join('');
  }

  function _updateMask() {
    const result = _maskText($sourceInput.value);
    if (result.rejected) {
      $sourceInput.value = _lastAcceptedSourceValue;
      _showToast(result.violation.message);
      return;
    }
    $maskedOutput.value = result.text;
    if ($modeLabel) $modeLabel.textContent = _modeText(result.mode);
    _lastAcceptedSourceValue = $sourceInput.value;
    _renderMappings();
    _updateRestore();
  }

  function _updateRestore() {
    const result = _restoreText($restoreInput.value);
    if (result.rejected) {
      $restoreInput.value = _lastAcceptedRestoreValue;
      _showToast(result.violation.message);
      return;
    }
    $restoreOutput.value = result.text;
    _lastAcceptedRestoreValue = $restoreInput.value;
    if ($restoredCount) $restoredCount.textContent = String(result.restored);
    if ($unresolvedCount) $unresolvedCount.textContent = String(result.unresolved);
  }

  function _clearState() {
    _resetMappingState();
    if (_storageAvailable()) sessionStorage.removeItem(STORAGE_KEY);
  }

  function _clearAll(button) {
    $sourceInput.value = '';
    $maskedOutput.value = '';
    $restoreInput.value = '';
    $restoreOutput.value = '';
    _lastAcceptedSourceValue = '';
    _lastAcceptedRestoreValue = '';
    _clearState();
    if ($modeLabel) $modeLabel.textContent = '空';
    if ($restoredCount) $restoredCount.textContent = '0';
    if ($unresolvedCount) $unresolvedCount.textContent = '0';
    _renderMappings();
    _setCopyButtonFeedback(button, 'クリアしました');
  }

  function _discardMap() {
    _clearState();
    _renderMappings();
    _updateMask();
    _updateRestore();
    _showToast('対応表を破棄しました。必要な復元が残っていないか確認してください。');
  }

  function _setCopyButtonFeedback(button, message) {
    if (!button) return;
    if (!button.dataset.originalLabel) button.dataset.originalLabel = button.textContent;
    button.textContent = message;
    window.clearTimeout(_copyFeedbackTimers.get(button));
    const timer = window.setTimeout(() => {
      button.textContent = button.dataset.originalLabel;
      _copyFeedbackTimers.delete(button);
    }, 1600);
    _copyFeedbackTimers.set(button, timer);
  }

  async function _copyFrom(textarea, button) {
    const value = textarea.value;
    if (!value) {
      _setCopyButtonFeedback(button, 'コピー対象なし');
      return;
    }
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        textarea.focus();
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.setSelectionRange(0, 0);
        if (!copied) throw new Error('Copy command failed');
      }
      _setCopyButtonFeedback(button, 'コピーしました');
    } catch (_) {
      _setCopyButtonFeedback(button, 'コピー失敗');
    }
  }

  function _showToast(message) {
    window.clearTimeout(_toastTimer);
    $toast.textContent = message;
    $toast.hidden = false;
    _toastTimer = window.setTimeout(() => {
      $toast.hidden = true;
    }, 2600);
  }

  function _bindEvents() {
    $sourceInput.addEventListener('input', _updateMask);
    $restoreInput.addEventListener('input', _updateRestore);
    $('#clear-source-btn').addEventListener('click', () => {
      $sourceInput.value = '';
      _updateMask();
    });
    $('#clear-all-btn').addEventListener('click', (event) => _clearAll(event.currentTarget));
    $('#copy-masked-btn').addEventListener('click', (event) => _copyFrom($maskedOutput, event.currentTarget));
    $('#copy-restored-btn').addEventListener('click', (event) => _copyFrom($restoreOutput, event.currentTarget));
    $('#discard-map-btn').addEventListener('click', _discardMap);
  }

  _loadMappings();
  _bindEvents();
  _renderMappings();
  _updateRestore();

  window.__MaskingerTest = {
    mask(input) {
      return _maskText(input);
    },
    restore(input) {
      return _restoreText(input);
    },
    mappings() {
      return _state._mappings.map((item) => ({ ...item }));
    },
    limits() {
      return {
        inputMaxBytes: MASKINGER_INPUT_MAX_BYTES,
        inputMaxLines: MASKINGER_INPUT_MAX_LINES,
        maxMappings: MASKINGER_MAX_MAPPINGS,
        mappingRenderMaxRows: MASKINGER_MAPPING_RENDER_MAX_ROWS,
        mappingOriginalMaxBytes: MASKINGER_MAPPING_ORIGINAL_MAX_BYTES,
        storageMaxBytes: MASKINGER_STORAGE_MAX_BYTES
      };
    },
    validateInput(input) {
      return _inputLimitViolation(input);
    },
    replaceMappings(items) {
      const result = _replaceMappingsFromItems(items);
      _saveMappings();
      _renderMappings();
      _updateRestore();
      return result;
    },
    clear() {
      _clearAll();
    }
  };
})();
</script>
</body>
</html>
